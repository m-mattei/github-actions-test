name: Hello Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      message:
        description: 'Enter your message'
        required: true
        type: string
jobs:
  print-inputs:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: print environment variables
        run: |
          echo "URL: ${{ github.env.URL }}"
          echo "URL: ${{ vars.URL }}"
          echo "=============================="
      - name: Print inputs
        run: |
          echo "Your Message: ${{ inputs.message }}"
          echo ${{ github.repository }}
          echo ${{ env }}
          echo "=============================="
          
      - name: Print GitHub Contexts
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Environment Variables:"
          env
      - name: Print GitHub Contexts 2
        run: |
          echo "GITHUB_CONTEXT:"
          echo '${{ toJson(github) }}'
          echo "JOB_CONTEXT:"
          echo '${{ toJson(job) }}'
          echo "RUNNER_CONTEXT:"
          echo '${{ toJson(runner) }}'