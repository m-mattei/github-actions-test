name: Hello Workflow

on:
  workflow_call:
    inputs:
      literal:
        description: 'Enter your message'
        required: true
        type: string
      variable:
        description: 'Enter your message'
        required: true
        type: string
jobs:
  print-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Print inputs
        run: |
          echo "Your Literal: ${{ inputs.literal }}"
          echo "=============================="
          echo "Your Variable: ${{ inputs.variable }}"
          echo "=============================="
          